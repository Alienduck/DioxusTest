[package]
name = "fond_bevy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy = { version = "0.19", features = ["webgpu"] }
chacha20 = "0.10.1"
rand = "0.10.2"
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }

# Avoid wasm to crash after compiling
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
